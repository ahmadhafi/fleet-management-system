<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Samsung One UI Signature Blue Gradient -->
    <linearGradient id="samsungOneUiGradFav" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a8eff" />
      <stop offset="50%" stop-color="#0072de" />
      <stop offset="100%" stop-color="#0052b4" />
    </linearGradient>

    <!-- Top Rim Inner Glow -->
    <linearGradient id="samsungRimGlowFav" x1="256" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Car Body Drop Shadow -->
    <filter id="carShadowFav" x="80" y="110" width="352" height="280" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#031633" flood-opacity="0.40" />
    </filter>
  </defs>

  <!-- Samsung One UI Continuous Curvature Squircle -->
  <rect width="512" height="512" rx="124" fill="url(#samsungOneUiGradFav)" />
  <rect x="6" y="6" width="500" height="500" rx="120" stroke="url(#samsungRimGlowFav)" stroke-width="6" fill="none" />

  <!-- Ambient Samsung Tech Mobility Rings -->
  <circle cx="256" cy="256" r="215" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" fill="none" />
  <circle cx="256" cy="256" r="185" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" fill="none" />

  <!-- Center Vehicle Composition with Soft Shadow -->
  <g id="fleetCar" filter="url(#carShadowFav)">
    <!-- Ground Contact Shadow -->
    <ellipse cx="256" cy="358" rx="138" ry="14" fill="#04142b" fill-opacity="0.45" />

    <!-- Performance Tires -->
    <rect x="138" y="322" width="28" height="38" rx="10" fill="#091b30" />
    <rect x="346" y="322" width="28" height="38" rx="10" fill="#091b30" />

    <!-- Aerodynamic Side Mirrors -->
    <path d="M136 230 L108 238 C102 240 98 245 98 251 C98 259 106 265 114 263 L136 258 Z" fill="#ffffff" />
    <rect x="104" y="243" width="16" height="15" rx="4" fill="#0c2340" />
    <path d="M376 230 L404 238 C410 240 414 245 414 251 C414 259 406 265 398 263 L376 258 Z" fill="#ffffff" />
    <rect x="392" y="243" width="16" height="15" rx="4" fill="#0c2340" />

    <!-- Cabin / Aerodynamic Windshield Canopy -->
    <path d="M174 228 L192 152 C196 140 208 134 222 134 L290 134 C304 134 316 140 320 152 L338 228 Z" fill="#071b34" />
    <path d="M196 222 L214 144 L236 144 L218 222 Z" fill="#ffffff" fill-opacity="0.25" />
    <path d="M246 222 L258 144 L270 144 L258 222 Z" fill="#ffffff" fill-opacity="0.12" />
    <rect x="246" y="146" width="20" height="8" rx="3" fill="#ffffff" fill-opacity="0.4" />

    <!-- Main Sculpted Body Shell (Pure White Executive Stance) -->
    <rect x="132" y="222" width="248" height="126" rx="36" fill="#ffffff" />

    <!-- Elegant Hood Character Creases -->
    <path d="M162 222 L256 238 L350 222" stroke="#cbe2ff" stroke-width="3" stroke-linecap="round" fill="none" />
    <line x1="256" y1="222" x2="256" y2="238" stroke="#cbe2ff" stroke-width="2" stroke-linecap="round" />

    <!-- Horizon LED Lightbar across Upper Fascia -->
    <rect x="150" y="258" width="212" height="8" rx="4" fill="#ffffff" />
    <rect x="154" y="260" width="204" height="4" rx="2" fill="#d9edff" />

    <!-- Deep Obsidian Aero Center Grille / Fascia -->
    <rect x="156" y="274" width="200" height="44" rx="14" fill="#081d38" stroke="#0072de" stroke-width="2" />

    <!-- Dual Projector LED Headlamps (Left & Right) with Blue Corona Rings -->
    <rect x="136" y="260" width="30" height="20" rx="7" fill="#0072de" />
    <circle cx="151" cy="270" r="6.5" fill="#ffffff" />
    <circle cx="151" cy="270" r="3" fill="#99d1ff" />

    <rect x="346" y="260" width="30" height="20" rx="7" fill="#0072de" />
    <circle cx="361" cy="270" r="6.5" fill="#ffffff" />
    <circle cx="361" cy="270" r="3" fill="#99d1ff" />

    <!-- Elegant Chrome Multi-Louver Grille Slats -->
    <line x1="172" y1="284" x2="340" y2="284" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="176" y1="294" x2="336" y2="294" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <line x1="182" y1="304" x2="330" y2="304" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Signature Samsung Blue Crest Emblem -->
    <circle cx="256" cy="268" r="9" fill="#0072de" stroke="#ffffff" stroke-width="2" />
    <circle cx="256" cy="268" r="4.5" fill="#ffffff" />

    <!-- Lower Aero Bumper & High-Luminance LED Fog Lamps -->
    <rect x="176" y="326" width="160" height="12" rx="6" fill="#07182c" />
    <circle cx="154" cy="332" r="5" fill="#ffffff" />
    <circle cx="154" cy="332" r="2.5" fill="#0072de" />
    <circle cx="358" cy="332" r="5" fill="#ffffff" />
    <circle cx="358" cy="332" r="2.5" fill="#0072de" />
  </g>

  <!-- Speed Lane Road Baseline -->
  <rect x="166" y="382" width="180" height="6" rx="3" fill="#ffffff" fill-opacity="0.25" />
  <rect x="226" y="382" width="60" height="6" rx="3" fill="#ffffff" />

  <!-- Typography: Samsung One UI Mobility Branding -->
  <text x="256" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">GALAXY FLEET</text>
  <text x="256" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#9ecaff" letter-spacing="2.5" text-anchor="middle">CORPORATE MOBILITY</text>
</svg>