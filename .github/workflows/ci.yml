name: Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
      - develop
      - test
  pull_request:
    branches:
      - main
      - staging
      - develop
      - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Code Quality, Type Safety & Acceptance Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase (Oxlint)
        run: npm run lint

      - name: Strict TypeScript Compilation Check
        run: npx tsc -p tsconfig.app.json --noEmit && npx tsc -p tsconfig.node.json --noEmit

      - name: Run Full Acceptance & Security Test Suites (Vitest)
        run: npm test
        env:
          NODE_ENV: test
          DB_PATH: ':memory:'

      - name: Build Production Client Assets
        run: npm run build
